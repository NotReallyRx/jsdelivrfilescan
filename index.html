<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Index</title>
</head>

<body>
  <pre id="output">Loading…</pre>

  <script>
    const ROOT =
      "https://cdn.jsdelivr.net/gh/NotReallyRx/bocchi@main/a/html/";

    const output = document.getElementById("output");

    async function getLinks(url) {
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(
          `${response.status} ${response.statusText}: ${url}`
        );
      }

      const html = await response.text();

      const doc = new DOMParser().parseFromString(
        html,
        "text/html"
      );

      return [...doc.querySelectorAll("a[href]")]
        .map(a => a.href)
        .filter(Boolean);
    }

    async function scan() {
      const queue = [ROOT];
      const visited = new Set();
      const files = [];

      const rootUrl = new URL(ROOT);

      while (queue.length) {
        const directory = queue.shift();

        if (visited.has(directory)) {
          continue;
        }

        visited.add(directory);

        const links = await getLinks(directory);

        for (const link of links) {
          const url = new URL(link);

          url.search = "";
          url.hash = "";

          // Only scan inside /a/html/
          if (
            url.origin !== rootUrl.origin ||
            !url.pathname.startsWith(rootUrl.pathname)
          ) {
            continue;
          }

          if (url.href === directory) {
            continue;
          }

          const relativePath = decodeURIComponent(
            url.pathname.slice(rootUrl.pathname.length)
          );

          if (!relativePath) {
            continue;
          }

          // Directory
          if (relativePath.endsWith("/")) {
            if (!visited.has(url.href)) {
              queue.push(url.href);
            }
          }

          // File
          else {
            files.push(relativePath);
          }
        }
      }

      return [...new Set(files)].sort();
    }

    async function main() {
      try {
        const files = await scan();

        const result = {
          repository: "NotReallyRx/bocchi",
          root: "a/html",
          count: files.length,
          files
        };

        output.textContent =
          JSON.stringify(result, null, 2);

        window.fileIndex = result;

      } catch (error) {
        const result = {
          error: error.message
        };

        output.textContent =
          JSON.stringify(result, null, 2);

        console.error(error);
      }
    }

    main();
  </script>
</body>
</html>
